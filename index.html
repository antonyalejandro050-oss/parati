<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUNILDA 💜</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0514;overflow:hidden;width:100vw;height:100vh;cursor:none}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
#trailCanvas{z-index:1} #c{z-index:2}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:white;color:#4c1d95;border:none;padding:18px 36px;border-radius:999px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 10px 40px rgba(168,85,247,.7);font-family:'Poppins'}
#start.hidden{display:none}
.mariposa{position:fixed;z-index:5;pointer-events:none;will-change:transform}
.mariposa.cuerpo{width:5px;height:13px;background:#2d1b4e;border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.mariposa.ala{position:absolute;width:22px;height:28px;background:linear-gradient(135deg,#a78bfa,#f0abfc);border-radius:80% 20% 60% 30%;opacity:.95;transform-origin:right center;animation:aleteo.14s infinite alternate;box-shadow:0 0 12px #e879f9}
.mariposa.ala.izq{left:-17px;top:0}.mariposa.ala.der{right:-17px;top:0;transform-origin:left center;transform:scaleX(-1);animation-delay:.06s}
.mariposa.hilo{position:absolute;left:50%;top:13px;width:1.5px;height:22px;background:rgba(255,255,255,.8);transform:translateX(-50%)}
.mariposa.cartel{position:absolute;left:50%;top:35px;transform:translateX(-50%);background:rgba(255,255,255,.97);color:#ff4d5e;padding:10px 20px;border-radius:16px;white-space:nowrap;font-family:'Poppins';font-size:19px;font-weight:800;box-shadow:0 6px 20px rgba(255,77,94,.45);border:2.5px solid #ff9aa2}
@keyframes aleteo{from{transform:rotateY(0deg) rotateZ(-12deg)} to{transform:rotateY(65deg) rotateZ(12deg)}}
#gatito{position:fixed;z-index:6;font-size:34px;pointer-events:none;filter:drop-shadow(0 0 10px #a855f7);will-change:transform}
.amor{position:fixed;z-index:10;pointer-events:none;font-family:'Dancing Script';font-size:30px;font-weight:700;text-shadow:0 0 15px currentColor,0 0 30px white;animation:flotarAmor 2.2s ease-out forwards}
@keyframes flotarAmor{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0} 20%{opacity:1;transform:translate(-50%,-50%) scale(1.3)} 100%{transform:translate(-50%,-160px) scale(1);opacity:0}}
</style>
</head>
<body>
<button id="start">Toca aquí para SUNILDA 💜</button>
<canvas id="trailCanvas"></canvas>
<canvas id="c"></canvas>
<div id="gatito">🐱</div>
<audio id="music" loop><source src="musica.mp3" type="audio/mpeg"></audio>
<script>
const trailCanvas=document.getElementById('trailCanvas'), tCtx=trailCanvas.getContext('2d');
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const audio=document.getElementById('music'), btn=document.getElementById('start'), gatitoEl=document.getElementById('gatito');
function resize(){trailCanvas.width=canvas.width=innerWidth;trailCanvas.height=canvas.height=innerHeight} resize(); window.addEventListener('resize',resize);

class Particula{
  constructor(x,y,rgb){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*3;this.vy=(Math.random()-0.5)*3;this.radio=Math.random()*6+2;this.rgb=rgb||[168,85,247];this.vida=1}
  actualizar(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.02;this.vida-=0.02;this.radio*=0.98}
  dibujar(){if(this.vida<=0)return;ctx.save();ctx.globalAlpha=this.vida;ctx.fillStyle=`rgba(${this.rgb[0]},${this.rgb[1]},${this.rgb[2]},${this.vida})`;ctx.shadowBlur=10;ctx.shadowColor=`rgba(${this.rgb[0]},${this.rgb[1]},${this.rgb[2]},1)`;ctx.beginPath();ctx.arc(this.x,this.y,this.radio,0,Math.PI*2);ctx.fill();ctx.restore()}
}
let particulas=[], mouseX=innerWidth/2, mouseY=innerHeight/2, curX=mouseX, curY=mouseY, catX=curX, catY=curY, started=false;
window.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;if(started)particulas.push(new Particula(mouseX,mouseY,[180,120,255]))});
window.addEventListener('touchmove',e=>{mouseX=e.touches[0].clientX;mouseY=e.touches[0].clientY;if(started)particulas.push(new Particula(mouseX,mouseY,[180,120,255]))},{passive:false});

const coloresSunilda=['#ffe6ff','#ff8fab','#a78bfa','#f472b6','#60a5fa','#fb7185','#ff4d5e','#34d399','#22d3ee'];
let colorActual=coloresSunilda[0]; setInterval(()=>{colorActual=coloresSunilda[Math.floor(Math.random()*coloresSunilda.length)]},2000);

const frases=["Eres única 💜","Sigue floreciendo 🌸","Mi favorita ✨","Nunca dejes de brillar","Eres magia pura 🦋","Siempre tú, Sunilda"];
let mariposas=[];
function crearMariposa(){
  const el=document.createElement('div'); el.className='mariposa';
  el.innerHTML=`<div class="ala izq"></div><div class="ala der"></div><div class="cuerpo"></div><div class="hilo"></div><div class="cartel">${frases[Math.floor(Math.random()*frases.length)]}</div>`;
  document.body.appendChild(el);
  mariposas.push({el,x:Math.random()*innerWidth,y:innerHeight+60,vx:(Math.random()-0.5)*1.6,vy:-(Math.random()*0.9+0.6),osc:0,vel:Math.random()*0.04+0.02,trail:[]});
}

let cuadros=[];
const paletaCuadros=[
  {bg:'#00f5ff', rgb:[0,245,255]}, {bg:'#ff006a', rgb:[255,0,106]}, {bg:'#39ff14', rgb:[57,255,20]},
  {bg:'#ff8c00', rgb:[255,140,0]}, {bg:'#ff1493', rgb:[255,20,147]}, {bg:'#00ffcc', rgb:[0,255,204]},
  {bg:'#ffd700', rgb:[255,215,0]}, {bg:'#7c3aed', rgb:[124,58,237]}, {bg:'#ff4500', rgb:[255,69,0]}
];
const frasesAmor=["Te amo Sunilda 💖","Eres mi todo","Me encantas","Mi corazón es tuyo","Contigo siempre 💜","Eres mi sueño","Te pienso mucho","Mi vida eres tú","Eres mi luz ✨","Solo tú"];

function crearCuadro(){
  let c=paletaCuadros[Math.floor(Math.random()*paletaCuadros.length)];
  cuadros.push({x:Math.random()*innerWidth,y:-30,vx:(Math.random()-0.5)*1.2,vy:Math.random()*1.2+0.8,size:Math.random()*14+14,rot:Math.random()*360,rotV:(Math.random()-0.5)*4,bg:c.bg,rgb:c.rgb});
}

function mostrarFraseAmor(x,y,color){
  const f=document.createElement('div'); f.className='amor';
  f.textContent=frasesAmor[Math.floor(Math.random()*frasesAmor.length)];
  f.style.left=x+'px'; f.style.top=y+'px'; f.style.color=color;
  document.body.appendChild(f); setTimeout(()=>f.remove(),2200);
}

function actualizar(){
  tCtx.fillStyle='rgba(10,5,20,0.16)'; tCtx.fillRect(0,0,trailCanvas.width,trailCanvas.height);

  // mariposas con rastro
  mariposas.forEach(m=>{
    m.osc+=m.vel; m.x+=m.vx+Math.sin(m.osc)*0.9; m.y+=m.vy;
    m.trail.push({x:m.x,y:m.y}); if(m.trail.length>18) m.trail.shift();
    for(let i=0;i<m.trail.length;i++){let p=m.trail[i],a=i/m.trail.length*0.5; tCtx.beginPath(); tCtx.fillStyle=`rgba(232,121,249,${a})`; tCtx.arc(p.x,p.y,2.5,0,Math.PI*2); tCtx.fill();}
    m.el.style.transform=`translate(${m.x}px,${m.y}px) rotate(${Math.sin(m.osc)*12}deg)`;
    if(m.y<-120){m.y=innerHeight+60; m.x=Math.random()*innerWidth; m.trail=[];}
  });

  // cuadros - COLISION FIX: no se detiene, solo marca para borrar
  let paraBorrar=[];
  cuadros.forEach((q, idx)=>{
    q.x+=q.vx; q.y+=q.vy; q.rot+=q.rotV;
    let dx=q.x-curX, dy=q.y-curY;
    if(dx*dx+dy*dy < 90*90){ // colision
      mostrarFraseAmor(curX,curY-60,q.bg);
      for(let k=0;k<18;k++) particulas.push(new Particula(q.x,q.y,q.rgb));
      paraBorrar.push(idx);
    }
    tCtx.save(); tCtx.translate(q.x,q.y); tCtx.rotate(q.rot*Math.PI/180);
    tCtx.fillStyle=q.bg; tCtx.shadowBlur=20; tCtx.shadowColor=q.bg;
    tCtx.fillRect(-q.size/2,-q.size/2,q.size,q.size);
    tCtx.strokeStyle='white'; tCtx.lineWidth=1.5; tCtx.strokeRect(-q.size/2,-q.size/2,q.size,q.size);
    tCtx.restore();
    if(q.y>innerHeight+70) paraBorrar.push(idx);
  });
  // borrar al reves para no romper indices
  paraBorrar.sort((a,b)=>b-a).forEach(i=> cuadros.splice(i,1));
}

let timerCuadro, timerMariposa;
function loop(){
  ctx.fillStyle='rgba(10,5,20,0.3)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  curX+=(mouseX-curX)*0.12; curY+=(mouseY-curY)*0.12;
  catX+=(curX-45-catX)*0.07; catY+=(curY+18-catY)*0.07;
  gatitoEl.style.transform=`translate(${catX}px,${catY}px)`;

  if(started && Math.random()<0.4) particulas.push(new Particula(mouseX,mouseY,[180,120,255]));
  for(let i=particulas.length-1;i>=0;i--){particulas[i].actualizar();particulas[i].dibujar();if(particulas[i].vida<=0)particulas.splice(i,1);}

  if(started){
    actualizar();
    ctx.save(); ctx.translate(curX,curY);
    ctx.shadowBlur=35; ctx.shadowColor=colorActual; ctx.fillStyle=colorActual; ctx.font='700 64px "Dancing Script"'; ctx.textAlign='center'; ctx.fillText('SUNILDA',0,-10);
    ctx.shadowBlur=0; ctx.fillStyle='rgba(200,180,230,.92)'; ctx.font='700 14px Poppins'; ctx.fillText('Atrapa los cuadritos 💜',0,34);
    ctx.restore();
  }
  requestAnimationFrame(loop);
} loop();

btn.addEventListener('click',()=>{
  started=true; btn.classList.add('hidden');
  tCtx.fillStyle='#0a0514'; tCtx.fillRect(0,0,trailCanvas.width,trailCanvas.height);
  audio.volume=0.75; audio.play().catch(()=>{});
  timerMariposa=setInterval(()=>{if(mariposas.length<5) crearMariposa();},1800);
  timerCuadro=setInterval(()=>{if(cuadros.length<15) crearCuadro();},500);
  for(let i=0;i<3;i++) setTimeout(crearMariposa,i*300);
  for(let i=0;i<6;i++) setTimeout(crearCuadro,i*200);
});
</script>
</body>
</html>
